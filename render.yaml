# Render.com blueprint: deploys the whole game (client + API + realtime)
# as one free-tier web service. In Render: New -> Blueprint -> pick this
# repo. Note: the free tier has no persistent disk, so the SQLite database
# resets when the service redeploys or sleeps — fine for testing.
services:
  - type: web
    name: throwdown
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: '3001'
