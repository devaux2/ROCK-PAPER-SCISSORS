name: Deploy web client to GitHub Pages

# Builds the game CLIENT for GitHub Pages. Pages is static hosting only —
# the multiplayer server can't run here. Set the repository variable
# API_URL (Settings -> Secrets and variables -> Actions -> Variables) to
# your deployed game server's URL, or the client will load but have no
# backend to talk to.

# Manual-only: the recommended deploy is Render (render.yaml), which hosts
# the client AND the server at one URL. Run this workflow only if you want
# an additional static client on github.io pointed at that server.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web client
        working-directory: apps/mobile
        env:
          EXPO_OFFLINE: '1'
          # Pages serves from /<repo-name>/, so assets need that prefix.
          WEB_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
        run: npm run build:web
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
